name: transcode
on:
  workflow_dispatch:
    inputs:
      input_key:
        required: true
      job_id:
        required: true

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ secrets.R2_BUCKET }}
      INPUT_KEY: ${{ inputs.input_key }}
      JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Télécharger depuis R2
        run: aws s3 cp "s3://$BUCKET/$INPUT_KEY" in.mp4 --endpoint-url "$R2_ENDPOINT"

      - name: Transcoder
        run: bash transcode.sh

      - name: Envoyer vers R2
        run: aws s3 sync out "s3://$BUCKET/chunk_001/$JOB_ID/" --endpoint-url "$R2_ENDPOINT"

      - name: Prévenir le Worker
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          STATUS: ${{ job.status }}
        run: |
          jq -n --arg job_id "$JOB_ID" --arg input_key "$INPUT_KEY" --arg status "$STATUS" \
            '{job_id: $job_id, input_key: $input_key, status: $status}' \
          | curl -sS -X POST "$CALLBACK_URL" \
              -H "Authorization: Bearer $CALLBACK_SECRET" \
              -H "Content-Type: application/json" \
              --data-binary @- || true
